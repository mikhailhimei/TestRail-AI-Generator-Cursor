name: Publish JSON mocks release
on:
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'mikhailhimei'
    timeout-minutes: 5
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MCP protocols and all CLI routes
        run: node --test tests/*.test.mjs
      - name: Build and verify release archives
        run: |
          python3 installers/package.py release-dist
          cp release-artifacts/v1.5.5/testrail-chrome-extension.zip release-dist/
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path('release-dist')
          for file in root.glob('*.zip'):
              with zipfile.ZipFile(file) as archive:
                  assert archive.testzip() is None
                  if file.name == 'testrail-chrome-extension.zip':
                      assert json.loads(archive.read('manifest.json'))['version'] == '1.1.7'
                  else:
                      assert 'testrail-chat/runtime/codex-json-mocks.mjs' in archive.namelist()
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in sorted(root.glob('*.zip'))))
          PY
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v1.5.6 >/dev/null 2>&1; then
            gh release create v1.5.6 --draft --target "${{ github.sha }}" --title 'v1.5.6 — Докачка CLI при медленном соединении' --notes-file release-artifacts/v1.5.6/notes.md
          fi
          gh release upload v1.5.6 release-dist/* --clobber
          gh release edit v1.5.6 --draft=false --latest --title 'v1.5.6 — Докачка CLI при медленном соединении' --notes-file release-artifacts/v1.5.6/notes.md
